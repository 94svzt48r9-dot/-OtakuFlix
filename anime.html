<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OtakuFlix - تفاصيل الأنمي</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#08080c;
    color:white;
    min-height:100vh;
}

header{
    background:#111117;
    border-bottom:1px solid #292933;
    padding:25px;
    text-align:center;
}

.logo{
    font-size:38px;
    font-weight:bold;
    color:#e52b25;
}

.logo span{
    color:white;
}

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto 60px;
}

.back{
    display:inline-block;
    background:#262630;
    color:white;
    text-decoration:none;
    padding:14px 22px;
    border-radius:14px;
    font-size:18px;
    margin-bottom:25px;
}

.back:hover{
    background:#e52b25;
}

.loading{
    text-align:center;
    color:#aaa;
    font-size:21px;
    padding:70px 20px;
}

.error{
    background:#17171f;
    border:1px solid #343440;
    border-radius:20px;
    padding:50px 20px;
    text-align:center;
    color:#ff7777;
    font-size:20px;
}

.anime{
    background:#15151c;
    border:1px solid #292934;
    border-radius:22px;
    padding:25px;
}

.hero{
    display:flex;
    gap:28px;
    align-items:flex-start;
}

.poster{
    width:250px;
    min-width:250px;
    height:360px;
    object-fit:cover;
    border-radius:16px;
}

.info{
    flex:1;
}

.title{
    font-size:35px;
    margin-bottom:8px;
}

.english{
    color:#999;
    font-size:17px;
    margin-bottom:20px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:22px;
}

.tag{
    background:#292933;
    padding:9px 13px;
    border-radius:10px;
    color:#ddd;
}

.rating{
    color:#ffd43b;
}

.story-title{
    font-size:25px;
    margin:20px 0 12px;
}

.story{
    color:#ddd;
    line-height:2;
    font-size:18px;
}

.genres{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:20px;
}

.genre{
    background:#e52b25;
    padding:7px 12px;
    border-radius:20px;
    font-size:13px;
}

.episodes-title{
    font-size:30px;
    margin:40px 0 20px;
}

.episodes{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(170px,1fr));
    gap:13px;
}

.episode{
    background:#20202a;
    border:1px solid #30303a;
    border-radius:13px;
    padding:16px;
    text-align:center;
}

.episode-number{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.episode-title{
    color:#aaa;
    font-size:14px;
    line-height:1.5;
    min-height:40px;
}

.watch-btn{
    margin-top:12px;
    width:100%;
    border:0;
    border-radius:9px;
    padding:10px;
    background:#e52b25;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.watch-btn:hover{
    background:#ff3c35;
}

.no-episodes{
    color:#aaa;
    text-align:center;
    padding:35px;
}

footer{
    border-top:1px solid #25252d;
    padding:30px;
    text-align:center;
    color:#777;
}

@media(max-width:700px){

    .hero{
        flex-direction:column;
        align-items:center;
    }

    .poster{
        width:220px;
        min-width:220px;
        height:320px;
    }

    .info{
        width:100%;
    }

    .title{
        font-size:28px;
        text-align:center;
    }

    .english{
        text-align:center;
    }

    .story{
        font-size:16px;
    }

    .episodes{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>


<body>

<header>

    <div class="logo">
        🎬 <span>Otaku</span>Flix
    </div>

</header>


<div class="container">

    <a href="index.html" class="back">
        ← العودة للرئيسية
    </a>


    <div id="content">

        <div class="loading">
            ⏳ جاري تحميل معلومات الأنمي...
        </div>

    </div>

</div>


<footer>
    © OtakuFlix 2026
</footer>


<script>

/* =========================================
   قراءة ID الأنمي
========================================= */

const params =
    new URLSearchParams(window.location.search);

const animeId =
    params.get("id");


const content =
    document.getElementById("content");


/* =========================================
   البيانات العربية للأنميات الثمانية
========================================= */

const arabicStories = {

    "5114":
    "تدور القصة حول الأخوين إدوارد وألفونس إلريك، اللذين حاولا استخدام الخيمياء لإعادة والدتهما إلى الحياة، لكن التجربة انتهت بكارثة أفقدت ألفونس جسده وأفقدت إدوارد أجزاءً من جسده. ينطلق الأخوان في رحلة للبحث عن حجر الفيلسوف لاستعادة أجسادهما، وخلال رحلتهما يكتشفان مؤامرة خطيرة تهدد البلاد.",

    "16498":
    "تعيش البشرية خلف أسوار ضخمة تحميها من العمالقة، وهم مخلوقات هائلة تلتهم البشر. عندما يظهر عملاق ضخم ويتمكن من اختراق أحد الأسوار، تتغير حياة إيرين ييغر إلى الأبد. ينضم إيرين إلى الجيش ويقرر القضاء على العمالقة، لكنه يكتشف لاحقاً أن وراءهم أسراراً أكبر بكثير مما كان يتخيل.",

    "1535":
    "يعثر الطالب العبقري لايت ياغامي على مذكرة غامضة تمنح صاحبها القدرة على قتل أي شخص بمجرد كتابة اسمه فيها. يقرر لايت استخدامها للقضاء على المجرمين وبناء عالم جديد، لكن المحقق العبقري المعروف باسم إل يبدأ بمطاردته، وتبدأ بينهما مواجهة عقلية خطيرة.",

    "30276":
    "سايتاما رجل عادي أصبح بطلاً خارقاً بعد تدريب شاق استمر ثلاث سنوات. أصبح قوياً لدرجة أنه يستطيع هزيمة معظم أعدائه بلكمة واحدة فقط. ورغم قوته الهائلة، يشعر سايتاما بالملل لأنه لا يجد خصماً حقيقياً يستطيع تحديه.",

    "11757":
    "يدخل آلاف اللاعبين إلى لعبة الواقع الافتراضي Sword Art Online، لكنهم يكتشفون أنهم أصبحوا محاصرين داخل اللعبة، وأن الموت داخلها يعني الموت في العالم الحقيقي. يبدأ كيريتو رحلة خطيرة للوصول إلى نهاية اللعبة وإنقاذ اللاعبين، وخلال الرحلة يلتقي بأسونا.",

    "21":
    "ينطلق مونكي دي لوفي في رحلة بحرية ليصبح ملك القراصنة ويعثر على الكنز الأسطوري المعروف باسم ون بيس. يجمع لوفي مجموعة من الأصدقاء المميزين ويخوض معهم مغامرات خطيرة في البحار والجزر المختلفة، ويكتشفون أسراراً كبيرة عن العالم وتاريخه.",

    "20":
    "ناروتو أوزوماكي نينجا شاب من قرية كونوها يحلم بأن يصبح الهوكاغي. يعاني من الوحدة بسبب نظرة الآخرين إليه، لكنه يواصل التدريب ويكوّن صداقات قوية مع ساسكي وساكورا. تبدأ رحلته بالعديد من المعارك والمنافسات والأحداث التي تغير حياته.",

    "269":
    "يستطيع إيتشيغو كوروساكي رؤية الأرواح منذ طفولته، لكن حياته تتغير عندما يلتقي بشينيغامي تدعى روكيا. بعد حصوله على قواها، يصبح مسؤولاً عن حماية البشر من الأرواح الشريرة المعروفة باسم الهولو، ويكتشف تدريجياً أسراراً عن قوته وعالم الأرواح."

};


/* =========================================
   تشغيل الصفحة
========================================= */

if(!animeId){

    showError(
        "❌ لم يتم تحديد الأنمي."
    );

}else{

    loadAnime(animeId);

}


/* =========================================
   تحميل تفاصيل الأنمي
========================================= */

async function loadAnime(id){

    try{

        const response =
            await fetch(
                `https://api.jikan.moe/v4/anime/${id}`
            );


        if(!response.ok){

            throw new Error(
                "Anime API error"
            );

        }


        const result =
            await response.json();


        if(!result.data){

            throw new Error(
                "No anime data"
            );

        }


        displayAnime(result.data);


    }catch(error){

        console.error(error);


        showError(
            "❌ تعذر تحميل معلومات الأنمي.<br><br>" +
            "حاول تحديث الصفحة بعد قليل."
        );

    }

}


/* =========================================
   عرض تفاصيل الأنمي
========================================= */

function displayAnime(anime){

    const title =
        anime.title ||
        anime.title_english ||
        "أنمي";


    const english =
        anime.title_english ||
        "";


    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        "";


    const score =
        anime.score
        ? anime.score.toFixed(1)
        : "N/A";


    const year =
        anime.year ||
        anime.aired?.prop?.from?.year ||
        "غير معروف";


    const totalEpisodes =
        anime.episodes ||
        "غير معروف";


    const status =
        anime.status ||
        "غير معروف";


    /*
       نستخدم القصة العربية الخاصة بالأنمي
       وإذا ما موجودة نستخدم قصة Jikan
    */

    const story =
        arabicStories[String(anime.mal_id)] ||
        anime.synopsis ||
        "لا توجد قصة متوفرة حالياً.";


    let genresHTML = "";


    if(anime.genres){

        genresHTML =
            anime.genres
            .map(
                genre =>
                `<span class="genre">
                    ${escapeHTML(genre.name)}
                </span>`
            )
            .join("");

    }


    content.innerHTML = `

        <div class="anime">

            <div class="hero">

                <img
                    class="poster"
                    src="${image}"
                    alt="${escapeHTML(title)}"
                >


                <div class="info">

                    <h1 class="title">
                        ${escapeHTML(title)}
                    </h1>


                    ${
                        english
                        ? `
                        <div class="english">
                            ${escapeHTML(english)}
                        </div>
                        `
                        : ""
                    }


                    <div class="tags">

                        <span class="tag rating">
                            ⭐ ${score}
                        </span>

                        <span class="tag">
                            📅 ${year}
                        </span>

                        <span class="tag">
                            🎞️ ${totalEpisodes} حلقة
                        </span>

                        <span class="tag">
                            📺 ${escapeHTML(status)}
                        </span>

                    </div>


                    <h2 class="story-title">
                        📖 قصة الأنمي
                    </h2>


                    <p class="story">
                        ${escapeHTML(story)}
                    </p>


                    <div class="genres">
                        ${genresHTML}
                    </div>

                </div>

            </div>


            <h2 class="episodes-title">
                📺 الحلقات
            </h2>


            <div id="episodes"
                 class="episodes">

                <div class="loading">
                    ⏳ جاري تحميل الحلقات...
                </div>

            </div>

        </div>

    `;


    /*
       مهم جداً:
       استدعاء الحلقات هنا بعد إنشاء
       عنصر #episodes
    */

    loadEpisodes(anime.mal_id);

}


/* =========================================
   تحميل الحلقات
========================================= */

async function loadEpisodes(malId){

    const episodesBox =
        document.getElementById("episodes");


    if(!episodesBox){

        return;

    }


    try{

        let allEpisodes = [];

        let page = 1;

        let hasNextPage = true;


        /*
           نجيب الصفحات بالتتابع.
           Jikan يقسم القوائم الطويلة إلى صفحات.
        */

        while(
            hasNextPage &&
            page <= 20
        ){

            if(page > 1){

                await sleep(1200);

            }


            const response =
                await fetch(
                    `https://api.jikan.moe/v4/anime/${malId}/episodes?page=${page}`
                );


            /*
               إذا API منع الطلب مؤقتاً
            */

            if(response.status === 429){

                await sleep(3000);

                continue;

            }


            if(!response.ok){

                throw new Error(
                    "Episodes API error"
                );

            }


            const result =
                await response.json();


            if(
                result.data &&
                Array.isArray(result.data)
            ){

                allEpisodes =
                    allEpisodes.concat(
                        result.data
                    );

            }


            hasNextPage =
                result.pagination?.has_next_page === true;


            page++;

        }


        /*
           ماكو حلقات
        */

        if(allEpisodes.length === 0){

            episodesBox.innerHTML = `

                <div class="no-episodes">

                    😔 لا توجد معلومات عن الحلقات حالياً.

                </div>

            `;

            return;

        }


        /*
           عرض الحلقات
        */

        episodesBox.innerHTML = "";


        allEpisodes.forEach(
            (episode,index) => {

                const number =
                    episode.mal_id ||
                    index + 1;


                const title =
                    episode.title ||
                    `الحلقة ${number}`;


                const card =
                    document.createElement("div");


                card.className =
                    "episode";


                card.innerHTML = `

                    <div class="episode-number">

                        الحلقة ${number}

                    </div>


                    <div class="episode-title">

                        ${escapeHTML(title)}

                    </div>


                    <button
                        class="watch-btn"
                        onclick="
                            watchEpisode(
                                ${number},
                                ${malId}
                            )
                        "
                    >

                        ▶ مشاهدة

                    </button>

                `;


                episodesBox.appendChild(card);

            }
        );


    }catch(error){

        console.error(
            "Episodes error:",
            error
        );


        episodesBox.innerHTML = `

            <div class="no-episodes">

                ⚠️ تعذر تحميل الحلقات حالياً.

                <br><br>

                حاول تحديث الصفحة بعد قليل.

            </div>

        `;

    }

}


/* =========================================
   زر مشاهدة
========================================= */

function watchEpisode(
    episodeNumber,
    malId
){

    /*
       حالياً ما عندنا مصدر فيديو قانوني
       مربوط بالموقع، لذلك لا نخترع رابط.
    */

    alert(
        "الحلقة " +
        episodeNumber +
        "\n\n" +
        "صفحة المشاهدة راح نضيفها بالخطوة القادمة 🎬"
    );

}


/* =========================================
   أدوات مساعدة
========================================= */

function sleep(ms){

    return new Promise(
        resolve =>
        setTimeout(resolve,ms)
    );

}


function escapeHTML(text){

    if(text === null ||
       text === undefined){

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function showError(message){

    content.innerHTML = `

        <div class="error">

            ${message}

        </div>

    `;

}

</script>

</body>

</html>
