<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OtakuFlix - تفاصيل الأنمي</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#08080c;
    color:white;
    min-height:100vh;
}

header{
    background:#111117;
    border-bottom:1px solid #292933;
    padding:28px 7%;
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:bold;
    color:#e52b25;
}

.logo span{
    color:white;
}

.container{
    width:92%;
    max-width:1100px;
    margin:35px auto;
}

.back{
    display:inline-block;
    background:#262630;
    color:white;
    text-decoration:none;
    padding:17px 28px;
    border-radius:18px;
    font-size:20px;
    margin-bottom:30px;
}

.back:hover{
    background:#33333f;
}

.loading{
    text-align:center;
    font-size:24px;
    color:#aaa;
    padding:80px 20px;
}

.error{
    background:#17171f;
    border:1px solid #343440;
    border-radius:25px;
    padding:60px 20px;
    text-align:center;
    color:#ff7770;
    font-size:22px;
}

.anime{
    background:#15151c;
    border:1px solid #292934;
    border-radius:25px;
    padding:30px;
}

.hero{
    display:flex;
    gap:30px;
    align-items:flex-start;
}

.poster{
    width:260px;
    min-width:260px;
    border-radius:18px;
    display:block;
}

.info{
    flex:1;
}

.title{
    font-size:38px;
    margin-bottom:12px;
}

.japanese{
    color:#aaa;
    font-size:18px;
    margin-bottom:20px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:25px;
}

.tag{
    background:#292933;
    padding:9px 14px;
    border-radius:12px;
    color:#ddd;
}

.description-title{
    font-size:27px;
    margin-top:30px;
    margin-bottom:15px;
}

.description{
    color:#ddd;
    line-height:2;
    font-size:19px;
}

.episodes-title{
    font-size:34px;
    margin:45px 0 20px;
}

.episodes{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
}

.episode{
    background:#252530;
    color:white;
    padding:18px;
    border-radius:14px;
    text-align:center;
    text-decoration:none;
    transition:.2s;
}

.episode:hover{
    background:#e52b25;
    transform:translateY(-2px);
}

.no-episodes{
    color:#aaa;
    font-size:18px;
    padding:25px 0;
}

footer{
    border-top:1px solid #25252d;
    margin-top:70px;
    padding:35px;
    text-align:center;
    color:#777;
}

@media(max-width:700px){

    header{
        padding:25px 15px;
    }

    .logo{
        font-size:34px;
    }

    .hero{
        flex-direction:column;
        align-items:center;
    }

    .poster{
        width:220px;
        min-width:220px;
    }

    .info{
        width:100%;
        text-align:right;
    }

    .title{
        font-size:30px;
    }

    .description{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎬 <span>Otaku</span>Flix</div>
</header>

<div class="container">

    <a href="index.html" class="back">← العودة للرئيسية</a>

    <div id="content">
        <div class="loading">⏳ جاري تحميل معلومات الأنمي...</div>
    </div>

</div>

<footer>
    © OtakuFlix 2026
</footer>

<script>

const content = document.getElementById("content");

/* نقرأ رقم الأنمي من الرابط */
const params = new URLSearchParams(window.location.search);

let animeId =
    params.get("id") ||
    params.get("mal_id") ||
    params.get("anime");

console.log("Anime ID:", animeId);

/* إذا ما وصل الرقم */
if(!animeId){

    content.innerHTML = `
        <div class="error">
            ❌ لم يتم تحديد الأنمي.<br><br>
            ارجع للرئيسية واختر أنمي من القائمة.
        </div>
    `;

}else{

    loadAnime(animeId);

}


/* تحميل معلومات الأنمي */
async function loadAnime(id){

    try{

        const response = await fetch(
            `https://api.jikan.moe/v4/anime/${encodeURIComponent(id)}/full`
        );

        if(!response.ok){
            throw new Error("Anime not found");
        }

        const result = await response.json();

        if(!result.data){
            throw new Error("No data");
        }

        const anime = result.data;

        displayAnime(anime);

    }catch(error){

        console.error(error);

        content.innerHTML = `
            <div class="error">
                ❌ تعذر تحميل معلومات هذا الأنمي.<br><br>
                تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.
            </div>
        `;
    }

}


/* عرض التفاصيل */
function displayAnime(anime){

    const title =
        anime.title ||
        anime.title_english ||
        "بدون عنوان";

    const japanese =
        anime.title_japanese ||
        "";

    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        "";

    const score =
        anime.score ?
        `⭐ ${anime.score}` :
        "⭐ غير متوفر";

    const year =
        anime.year ||
        anime.aired?.prop?.from?.year ||
        "غير معروف";

    const episodes =
        anime.episodes ||
        "غير معروف";

    const status =
        anime.status ||
        "غير معروف";

    const synopsis =
        anime.synopsis ||
        "لا توجد قصة متوفرة لهذا الأنمي حالياً.";

    let genres = "";

    if(anime.genres && anime.genres.length){

        genres = anime.genres
            .map(g => `<span class="tag">${g.name}</span>`)
            .join("");

    }


    content.innerHTML = `

        <div class="anime">

            <div class="hero">

                <img
                    class="poster"
                    src="${image}"
                    alt="${escapeHtml(title)}"
                >

                <div class="info">

                    <h1 class="title">
                        ${escapeHtml(title)}
                    </h1>

                    ${
                        japanese
                        ? `<div class="japanese">${escapeHtml(japanese)}</div>`
                        : ""
                    }

                    <div class="tags">

                        <span class="tag">
                            ${score}
                        </span>

                        <span class="tag">
                            📅 ${year}
                        </span>

                        <span class="tag">
                            🎞️ ${episodes} حلقة
                        </span>

                        <span class="tag">
                            📺 ${escapeHtml(status)}
                        </span>

                    </div>

                    ${
                        genres
                        ? `<div class="tags">${genres}</div>`
                        : ""
                    }

                    <h2 class="description-title">
                        📖 قصة الأنمي
                    </h2>

                    <p class="description">
                        ${escapeHtml(synopsis)}
                    </p>

                </div>

            </div>


            <h2 class="episodes-title">
                📺 الحلقات
            </h2>

            <div id="episodes" class="episodes">

                <div class="no-episodes">
                    ⏳ جاري تحميل الحلقات...
                </div>

            </div>

        </div>
    `;


    async function loadEpisodes(malId) {
    const episodesBox = document.getElementById("episodes");

    if (!episodesBox) return;

    episodesBox.innerHTML = `
        <div class="no-episodes">
            ⏳ جاري تحميل الحلقات...
        </div>
    `;

    try {
        let allEpisodes = [];
        let page = 1;
        let hasNextPage = true;

        while (hasNextPage && page <= 20) {

            // تأخير حتى لا يمنعنا Jikan
            if (page > 1) {
                await new Promise(resolve => setTimeout(resolve, 1500));
            }

            const url =
                `https://api.jikan.moe/v4/anime/${malId}/episodes?page=${page}`;

            let response;

            // محاولة الطلب حتى 3 مرات
            for (let attempt = 1; attempt <= 3; attempt++) {

                response = await fetch(url);

                if (response.status !== 429) {
                    break;
                }

                // إذا Jikan منع الطلب مؤقتًا
                await new Promise(resolve => setTimeout(resolve, 3000));
            }

            if (!response || !response.ok) {
                throw new Error(
                    `Episodes request failed: ${response?.status || "unknown"}`
                );
            }

            const result = await response.json();

            if (result.data && Array.isArray(result.data)) {
                allEpisodes = allEpisodes.concat(result.data);
            }

            hasNextPage =
                result.pagination &&
                result.pagination.has_next_page === true;

            page++;
        }

        // لا توجد حلقات
        if (allEpisodes.length === 0) {
            episodesBox.innerHTML = `
                <div class="no-episodes">
                    😔 لم يتم العثور على حلقات لهذا الأنمي
                </div>
            `;
            return;
        }

        // عرض الحلقات
        episodesBox.innerHTML = allEpisodes.map((episode, index) => {

            const episodeNumber =
                episode.mal_id || (index + 1);

            const title =
                episode.title || `الحلقة ${episodeNumber}`;

            const aired =
                episode.aired
                    ? new Date(episode.aired).toLocaleDateString("ar-IQ")
                    : "";

            return `
                <div class="episode-card">
                    <div class="episode-number">
                        ${episodeNumber}
                    </div>

                    <div class="episode-info">
                        <h3>${escapeHtml(title)}</h3>

                        ${
                            aired
                                ? `<span>📅 ${aired}</span>`
                                : ""
                        }
                    </div>

                    <button
                        class="watch-btn"
                        onclick="watchEpisode(${episodeNumber}, ${malId})">
                        ▶ مشاهدة
                    </button>
                </div>
            `;

        }).join("");

    } catch (error) {

        console.error("Episodes error:", error);

        episodesBox.innerHTML = `
            <div class="no-episodes">
                ❌ تعذر تحميل الحلقات
                <br>
                <small>
                    حاول تحديث الصفحة بعد قليل
                </small>
            </div>
        `;
    }
}
