<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OtakuFlix</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08080d;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111118;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #292934;
    }

    .logo {
      color: #e50914;
      font-size: 32px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px 60px;
    }

    .back {
      display: inline-block;
      background: #252530;
      color: white;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 11px;
      margin-bottom: 25px;
      font-size: 17px;
    }

    .details {
      background: #15151d;
      border: 1px solid #292934;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 40px;
    }

    .top {
      display: flex;
      gap: 28px;
      align-items: flex-start;
    }

    .poster {
      width: 250px;
      min-width: 250px;
      height: 360px;
      object-fit: cover;
      border-radius: 15px;
    }

    .info {
      flex: 1;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 20px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .badge {
      background: #252530;
      padding: 10px 14px;
      border-radius: 10px;
      color: #ddd;
    }

    .rating {
      color: #ffd43b;
    }

    .story-title {
      font-size: 23px;
      margin-bottom: 12px;
    }

    .story {
      color: #d0d0d0;
      line-height: 2;
      font-size: 17px;
    }

    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .genre {
      background: #e50914;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .section-title {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .episodes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .episode {
      background: #181821;
      border: 1px solid #2c2c38;
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
    }

    .episode-number {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .episode-title {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      color: #aaa;
      padding: 40px 10px;
      font-size: 18px;
    }

    .error {
      text-align: center;
      color: #ff7777;
      padding: 40px 10px;
    }

    footer {
      border-top: 1px solid #20202a;
      text-align: center;
      padding: 30px;
      color: #666;
    }

    @media (max-width: 700px) {

      .top {
        flex-direction: column;
        align-items: center;
      }

      .poster {
        width: 220px;
        min-width: 220px;
        height: 320px;
      }

      h1 {
        font-size: 27px;
        text-align: center;
      }

      .badges {
        justify-content: center;
      }

      .story-title {
        text-align: center;
      }

      .story {
        text-align: center;
        font-size: 16px;
      }

      .episodes {
        grid-template-columns: repeat(2, 1fr);
      }

    }

  </style>

</head>


<body>

<header>

  <div class="logo">
    🎬 OtakuFlix
  </div>

</header>

  <a href="index.html" class="back">
    ← العودة للرئيسية
  </a>

      جاري تحميل التفاصيل...

  <div id="episodes" class="episodes">

</main>


<footer>

/* =========================================
   عناصر الصفحة
========================================= */

const details =
  document.getElementById("details");

const episodes =
  document.getElementById("episodes");


/* =========================================
   التأكد من وجود الأنمي
========================================= */

if (!animeId || !animeData[animeId]) {

  details.innerHTML = `
    <div class="error">
      ❌ لم يتم العثور على هذا الأنمي.
      <br><br>
      ارجع للرئيسية واختر أنمي من القائمة.
    </div>
  `;

  episodes.innerHTML = "";

} else {

  showDetails(animeData[animeId]);

  loadEpisodes(animeId);

}


/* =========================================
   عرض التفاصيل العربية
========================================= */

function showDetails(anime) {

  document.title =
    anime.arabicTitle + " - OtakuFlix";


  details.innerHTML = `

    <div class="top">

      <img
        class="poster"
        src="${anime.image}"
        alt="${anime.arabicTitle}"
      >


      <div class="info">

        <h1>
          ${anime.arabicTitle}
        </h1>


        <div style="
          color:#999;
          margin-bottom:18px;
          font-size:16px;
        ">
          ${anime.title}
        </div>


        <div class="badges">

          <span class="badge">
            📅 ${anime.year}
          </span>

          <span class="badge">
            🎞️ ${anime.episodes} حلقة
          </span>

          <span class="badge rating">
            ⭐ ${anime.score}
          </span>

          <span class="badge">
            ${anime.status}
          </span>

        </div>


        <h2 class="story-title">
          📖 قصة الأنمي
        </h2>


        <p class="story">
          ${anime.story}
        </p>


        <div class="genres">

          ${anime.genres.map(
            genre => `
              <span class="genre">
                ${genre}
              </span>
            `
          ).join("")}

        </div>

      </div>

    </div>

  `;

}


/* =========================================
   تحميل الحلقات من Jikan
========================================= */

async function loadEpisodes(id) {

  episodes.innerHTML = `
    <div class="loading">
      جاري تحميل الحلقات...
    </div>
  `;


  try {

    let allEpisodes = [];

    let page = 1;

    let hasNext = true;


    /*
      كل صفحة تحتوي حتى 100 حلقة.
    */

    while (hasNext && page <= 20) {

      const response = await fetch(
        `https://api.jikan.moe/v4/anime/${id}/episodes?page=${page}`
      );


      if (!response.ok) {

        throw new Error(
          "Episode request failed"
        );

      }


      const result =
        await response.json();


      if (result.data) {

        allEpisodes =
          allEpisodes.concat(result.data);

      }


      hasNext =
        result.pagination?.has_next_page === true;


      page++;


      /*
        حتى ما نرسل طلبات بسرعة كبيرة.
      */

      if (hasNext) {

        await new Promise(
          resolve =>
            setTimeout(resolve, 600)
        );

      }

    }


    if (allEpisodes.length === 0) {

      episodes.innerHTML = `
        <div class="loading">
          لا توجد معلومات عن الحلقات حالياً.
        </div>
      `;

      return;

    }


    episodes.innerHTML = "";


    allEpisodes.forEach(ep => {

      const card =
        document.createElement("div");


      card.className =
        "episode";


      const number =
        ep.mal_id || "?";


      const title =
        ep.title ||
        `الحلقة ${number}`;


      card.innerHTML = `

        <div class="episode-number">
          الحلقة ${number}
        </div>

        <div class="episode-title">
          ${title}
        </div>

      `;


      episodes.appendChild(card);

    });


  } catch (error) {

    console.error(error);


    episodes.innerHTML = `
      <div class="error">
        ⚠️ تعذر تحميل قائمة الحلقات حالياً.
        <br><br>
        حاول تحديث الصفحة بعد قليل.
      </div>
    `;

  }

}
