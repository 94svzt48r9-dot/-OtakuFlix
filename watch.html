<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OtakuFlix - المشاهدة</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#08080c;
    color:white;
    min-height:100vh;
}

header{
    background:#111117;
    border-bottom:1px solid #292933;
    padding:20px;
    text-align:center;
}

.logo{
    font-size:34px;
    font-weight:bold;
    color:#e52b25;
}

.logo span{
    color:white;
}

.container{
    width:94%;
    max-width:1200px;
    margin:25px auto 60px;
}

.back{
    display:inline-block;
    background:#292933;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:10px;
    margin-bottom:20px;
}

.player{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border:1px solid #292933;
    border-radius:16px;
    overflow:hidden;
}

.player iframe{
    width:100%;
    height:100%;
    border:0;
}

.message{
    height:100%;
    min-height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.message .icon{
    font-size:55px;
    margin-bottom:15px;
}

.message h2{
    margin-bottom:12px;
}

.message p{
    color:#aaa;
    line-height:1.8;
}

.open-button{
    display:inline-block;
    margin-top:18px;
    padding:13px 22px;
    background:#e52b25;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.info{
    background:#15151c;
    border:1px solid #292933;
    border-radius:16px;
    padding:22px;
    margin-top:18px;
}

.title{
    font-size:28px;
    margin-bottom:8px;
}

.ep-title{
    color:#aaa;
}

.status{
    margin-top:15px;
    color:#aaa;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    flex:1;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#292933;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.btn:hover{
    background:#e52b25;
}

.episodes-title{
    margin:32px 0 15px;
}

.episodes{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(110px,1fr));
    gap:10px;
}

.episode{
    padding:14px 8px;
    text-align:center;
    border-radius:10px;
    background:#20202a;
    border:1px solid #30303a;
    cursor:pointer;
}

.episode:hover,
.episode.active{
    background:#e52b25;
}

.episode.available{
    border-color:#42b883;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:30px;
}

.error{
    text-align:center;
    color:#ff7777;
    padding:30px;
}

footer{
    border-top:1px solid #25252d;
    text-align:center;
    color:#777;
    padding:30px;
}

@media(max-width:600px){

    .buttons{
        flex-direction:column;
    }

    .title{
        font-size:23px;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">
        🎬 <span>Otaku</span>Flix
    </div>

</header>


<div class="container">

    <a class="back" href="index.html">
        ← العودة
    </a>

    <div id="content">

        <div class="loading">
            ⏳ جاري التحميل...
        </div>

    </div>

</div>


<footer>
    © OtakuFlix 2026
</footer>


<script>

/* =====================================
   معلومات الرابط
===================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const animeId =
    params.get("id");

const episodeNumber =
    Number(
        params.get("episode")
    ) || 1;

const content =
    document.getElementById("content");


/* =====================================
   البداية
===================================== */

if(!animeId){

    showError("❌ لم يتم تحديد الأنمي.");

}else{

    start();

}


/* =====================================
   تشغيل الصفحة
===================================== */

async function start(){

    try{

        const animeResponse =
            await fetch(
                `https://api.jikan.moe/v4/anime/${animeId}`
            );

        if(!animeResponse.ok){

            throw new Error(
                "anime"
            );

        }

        const animeData =
            await animeResponse.json();

        const anime =
            animeData.data;


        renderLoading(
            anime
        );


        /*
        أول شيء:
        نحاول جلب فيديوهات Jikan
        */

        const videos =
            await getVideos();


        /*
        نبحث عن الحلقة المطلوبة
        */

        const video =
            findEpisode(
                videos,
                episodeNumber
            );


        /*
        عرض المشغل
        */

        renderPlayer(
            anime,
            video
        );


        /*
        تحميل الحلقات
        */

        loadEpisodes(
            anime
        );


    }catch(error){

        console.error(error);

        showError(
            "❌ صار خطأ أثناء تحميل الصفحة."
        );

    }

}


/* =====================================
   تحميل فيديوهات Jikan
===================================== */

async function getVideos(){

    try{

        const response =
            await fetch(
                `https://api.jikan.moe/v4/anime/${animeId}/videos`
            );


        if(response.status === 429){

            await wait(2000);

            return null;

        }


        if(!response.ok){

            return null;

        }


        const result =
            await response.json();


        return result.data || null;


    }catch(error){

        console.log(
            "Videos error:",
            error
        );

        return null;

    }

}


/* =====================================
   البحث عن الحلقة
===================================== */

function findEpisode(
    videos,
    number
){

    if(!videos){

        return null;

    }


    const episodes =
        videos.episodes || [];


    return episodes.find(
        episode =>
            Number(
                episode.mal_id
            ) === Number(number)
    ) || null;

}


/* =====================================
   تحميل واجهة المعلومات
===================================== */

function renderLoading(anime){

    const title =
        anime.title ||
        anime.title_english ||
        "أنمي";


    content.innerHTML = `

        <div class="player">

            <div class="message">

                <div>

                    <div class="icon">
                        🔎
                    </div>

                    <h2>
                        جاري البحث عن الحلقة...
                    </h2>

                    <p>
                        نحاول العثور على مصدر
                        مشاهدة متاح.
                    </p>

                </div>

            </div>

        </div>


        <div class="info">

            <div class="title">

                ${escapeHTML(title)}

            </div>

            <div class="ep-title">

                الحلقة ${episodeNumber}

            </div>

            <div class="status"
                 id="status">

                🔎 جاري البحث...

            </div>

        </div>

    `;

}


/* =====================================
   عرض الفيديو
===================================== */

function renderPlayer(
    anime,
    video
){

    const player =
        document.querySelector(
            ".player"
        );

    const status =
        document.getElementById(
            "status"
        );


    /*
    ماكو فيديو
    */

    if(!video){

        player.innerHTML = `

            <div class="message">

                <div>

                    <div class="icon">
                        😔
                    </div>

                    <h2>
                        الحلقة غير متوفرة
                    </h2>

                    <p>
                        ما حصلنا مصدر فيديو
                        لهذه الحلقة عبر Jikan.
                    </p>

                </div>

            </div>

        `;


        if(status){

            status.textContent =
                "⚪ لم يتم العثور على مصدر للحلقة.";

        }


        return;

    }


    /*
    Jikan قد يرجع embed_url
    */

    if(video.embed_url){

        player.innerHTML = `

            <iframe

                src="${escapeHTML(video.embed_url)}"

                allowfullscreen

                loading="lazy"

                referrerpolicy="strict-origin-when-cross-origin">

            </iframe>

        `;


        if(status){

            status.textContent =
                "🟢 تم العثور على مصدر مشاهدة.";

        }


        return;

    }


    /*
    إذا يوجد رابط خارجي فقط
    */

    if(video.url){

        player.innerHTML = `

            <div class="message">

                <div>

                    <div class="icon">
                        ▶️
                    </div>

                    <h2>
                        تم العثور على المصدر
                    </h2>

                    <p>
                        المصدر لا يوفر تضميناً
                        داخل الموقع، لذلك
                        سنفتحه مباشرة.
                    </p>

                    <a

                        class="open-button"

                        href="${escapeHTML(video.url)}"

                        target="_blank"

                        rel="noopener noreferrer">

                        🚀 فتح الحلقة

                    </a>

                </div>

            </div>

        `;


        if(status){

            status.textContent =
                "🟡 المصدر موجود وسيتم فتحه خارج الموقع.";

        }


        return;

    }


    if(status){

        status.textContent =
            "⚪ المصدر غير قابل للاستخدام.";

    }

}


/* =====================================
   تحميل قائمة الحلقات
===================================== */

async function loadEpisodes(anime){

    const episodesBox =
        document.createElement(
            "div"
        );

    episodesBox.innerHTML = `

        <h2 class="episodes-title">
            📺 الحلقات
        </h2>

        <div class="episodes">

            <div class="loading">
                ⏳ جاري تحميل الحلقات...
            </div>

        </div>

    `;


    content.appendChild(
        episodesBox
    );


    const box =
        episodesBox.querySelector(
            ".episodes"
        );


    try{

        const response =
            await fetch(
                `https://api.jikan.moe/v4/anime/${animeId}/episodes?page=1`
            );


        if(!response.ok){

            throw new Error(
                "episodes"
            );

        }


        const result =
            await response.json();


        const episodes =
            result.data || [];


        if(!episodes.length){

            box.innerHTML = `
                <div class="error">
                    لا توجد حلقات.
                </div>
            `;

            return;

        }


        box.innerHTML = "";


        episodes.forEach(
            episode => {

                const number =
                    episode.mal_id;


                const button =
                    document.createElement(
                        "div"
                    );


                button.className =
                    "episode";


                if(
                    Number(number) ===
                    Number(episodeNumber)
                ){

                    button.classList.add(
                        "active"
                    );

                }


                button.innerHTML =
                    `الحلقة ${number}`;


                button.onclick =
                    () => {

                        window.location.href =
                            `watch.html?id=${animeId}&episode=${number}`;

                    };


                box.appendChild(
                    button
                );

            }
        );


    }catch(error){

        console.error(error);


        box.innerHTML = `

            <div class="error">

                ⚠️ تعذر تحميل الحلقات.

            </div>

        `;

    }

}


/* =====================================
   السابقة
===================================== */

function previousEpisode(){

    if(episodeNumber <= 1){

        return;

    }


    window.location.href =
        `watch.html?id=${animeId}&episode=${episodeNumber - 1}`;

}


/* =====================================
   التالية
===================================== */

function nextEpisode(){

    window.location.href =
        `watch.html?id=${animeId}&episode=${episodeNumber + 1}`;

}


/* =====================================
   الانتظار
===================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================
   تنظيف النص
===================================== */

function escapeHTML(text){

    return String(
        text ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================
   خطأ
===================================== */

function showError(message){

    content.innerHTML = `

        <div class="error">

            ${message}

        </div>

    `;

}

</script>

</body>
</html>
