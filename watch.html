<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OtakuFlix - المشاهدة</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#08080c;
    color:white;
    min-height:100vh;
}

header{
    background:#111117;
    border-bottom:1px solid #292933;
    padding:22px;
    text-align:center;
}

.logo{
    font-size:36px;
    font-weight:bold;
    color:#e52b25;
}

.logo span{
    color:white;
}

.container{
    width:94%;
    max-width:1200px;
    margin:25px auto 60px;
}

.back{
    display:inline-block;
    background:#292933;
    color:white;
    text-decoration:none;
    padding:13px 20px;
    border-radius:12px;
    margin-bottom:20px;
}

.back:hover{
    background:#e52b25;
}

.player-box{
    background:#000;
    border:1px solid #292933;
    border-radius:18px;
    overflow:hidden;
    aspect-ratio:16/9;
    display:flex;
    align-items:center;
    justify-content:center;
}

.player-message{
    text-align:center;
    padding:30px;
    color:#aaa;
}

.player-icon{
    font-size:55px;
    margin-bottom:15px;
}

.player-message h2{
    color:white;
    margin-bottom:12px;
}

.info{
    background:#15151c;
    border:1px solid #292933;
    border-radius:18px;
    margin-top:20px;
    padding:25px;
}

.anime-title{
    font-size:30px;
    margin-bottom:10px;
}

.episode-title{
    color:#aaa;
    font-size:18px;
}

.controls{
    display:flex;
    gap:12px;
    margin-top:22px;
}

.control{
    flex:1;
    border:0;
    border-radius:12px;
    padding:14px;
    background:#292933;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.control:hover{
    background:#e52b25;
}

.episodes-title{
    font-size:27px;
    margin:35px 0 18px;
}

.episodes{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(120px,1fr));
    gap:10px;
}

.episode{
    background:#20202a;
    border:1px solid #30303a;
    color:white;
    border-radius:11px;
    padding:14px 8px;
    text-align:center;
    cursor:pointer;
}

.episode:hover{
    background:#e52b25;
}

.episode.active{
    background:#e52b25;
    border-color:#ff5a53;
}

.loading{
    color:#aaa;
    text-align:center;
    padding:35px;
}

.error{
    color:#ff7777;
    text-align:center;
    padding:35px;
}

footer{
    border-top:1px solid #25252d;
    padding:30px;
    text-align:center;
    color:#777;
}

@media(max-width:600px){

    .anime-title{
        font-size:24px;
    }

    .controls{
        flex-direction:column;
    }

    .player-box{
        aspect-ratio:16/10;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        🎬 <span>Otaku</span>Flix
    </div>

</header>


<div class="container">


    <a href="index.html" class="back">
        ← العودة للرئيسية
    </a>


    <div id="page">

        <div class="loading">
            ⏳ جاري تحميل الحلقة...
        </div>

    </div>


</div>


<footer>

    © OtakuFlix 2026

</footer>


<script>


/* =========================================
   قراءة معلومات الرابط
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const animeId =
    params.get("id");


const episodeNumber =
    Number(
        params.get("episode")
    ) || 1;


const page =
    document.getElementById("page");


/* =========================================
   التحقق من الرابط
========================================= */

if(!animeId){

    page.innerHTML = `

        <div class="error">

            ❌ لم يتم تحديد الأنمي.

        </div>

    `;

}else{

    loadAnime();

}


/* =========================================
   تحميل معلومات الأنمي
========================================= */

async function loadAnime(){

    try{

        const response =
            await fetch(
                `https://api.jikan.moe/v4/anime/${animeId}`
            );


        if(!response.ok){

            throw new Error(
                "Anime request failed"
            );

        }


        const result =
            await response.json();


        if(!result.data){

            throw new Error(
                "No anime data"
            );

        }


        displayPage(
            result.data
        );


    }catch(error){

        console.error(error);

        page.innerHTML = `

            <div class="error">

                ❌ تعذر تحميل معلومات الأنمي.

                <br><br>

                حاول تحديث الصفحة.

            </div>

        `;

    }

}


/* =========================================
   عرض الصفحة
========================================= */

function displayPage(anime){

    const title =
        anime.title ||
        anime.title_english ||
        "أنمي";


    page.innerHTML = `

        <div class="player-box">

            <div class="player-message">

                <div class="player-icon">
                    ▶️
                </div>

                <h2>
                    ${escapeHTML(title)}
                </h2>

                <p>
                    الحلقة ${episodeNumber}
                </p>

                <br>

                <small>
                    مشغل الفيديو جاهز لإضافة مصدر مشاهدة
                </small>

            </div>

        </div>


        <div class="info">

            <h1 class="anime-title">
                ${escapeHTML(title)}
            </h1>

            <div class="episode-title">
                الحلقة ${episodeNumber}
            </div>


            <div class="controls">

                <button
                    class="control"
                    onclick="previousEpisode()">

                    ⏮ الحلقة السابقة

                </button>


                <button
                    class="control"
                    onclick="animeDetails()">

                    📖 تفاصيل الأنمي

                </button>


                <button
                    class="control"
                    onclick="nextEpisode()">

                    الحلقة التالية ⏭

                </button>

            </div>

        </div>


        <h2 class="episodes-title">
            📺 الحلقات
        </h2>


        <div id="episodes"
             class="episodes">

            <div class="loading">
                ⏳ جاري تحميل الحلقات...
            </div>

        </div>

    `;


    loadEpisodes();

}


/* =========================================
   تحميل الحلقات
========================================= */

async function loadEpisodes(){

    const box =
        document.getElementById("episodes");


    try{

        let episodes = [];

        let currentPage = 1;

        let hasNext = true;


        while(
            hasNext &&
            currentPage <= 20
        ){

            if(currentPage > 1){

                await sleep(1200);

            }


            const response =
                await fetch(
                    `https://api.jikan.moe/v4/anime/${animeId}/episodes?page=${currentPage}`
                );


            if(response.status === 429){

                await sleep(3000);

                continue;

            }


            if(!response.ok){

                throw new Error(
                    "Episodes request failed"
                );

            }


            const result =
                await response.json();


            if(
                result.data &&
                Array.isArray(result.data)
            ){

                episodes =
                    episodes.concat(
                        result.data
                    );

            }


            hasNext =
                result.pagination?.has_next_page === true;


            currentPage++;

        }


        if(!episodes.length){

            box.innerHTML = `

                <div class="error">

                    لا توجد حلقات متاحة حالياً.

                </div>

            `;

            return;

        }


        box.innerHTML = "";


        episodes.forEach(
            episode => {

                const number =
                    episode.mal_id;


                const button =
                    document.createElement(
                        "div"
                    );


                button.className =
                    "episode";


                if(
                    number === episodeNumber
                ){

                    button.classList.add(
                        "active"
                    );

                }


                button.textContent =
                    `الحلقة ${number}`;


                button.onclick =
                    () => {

                        window.location.href =
                            `watch.html?id=${animeId}&episode=${number}`;

                    };


                box.appendChild(
                    button
                );

            }
        );


    }catch(error){

        console.error(error);

        box.innerHTML = `

            <div class="error">

                ⚠️ تعذر تحميل الحلقات.

            </div>

        `;

    }

}


/* =========================================
   الحلقة السابقة
========================================= */

function previousEpisode(){

    if(episodeNumber <= 1){

        return;

    }


    window.location.href =
        `watch.html?id=${animeId}&episode=${episodeNumber - 1}`;

}


/* =========================================
   الحلقة التالية
========================================= */

function nextEpisode(){

    window.location.href =
        `watch.html?id=${animeId}&episode=${episodeNumber + 1}`;

}


/* =========================================
   تفاصيل الأنمي
========================================= */

function animeDetails(){

    window.location.href =
        `anime.html?id=${animeId}`;

}


/* =========================================
   أدوات
========================================= */

function sleep(ms){

    return new Promise(
        resolve =>
        setTimeout(resolve,ms)
    );

}


function escapeHTML(text){

    if(
        text === null ||
        text === undefined
    ){

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
