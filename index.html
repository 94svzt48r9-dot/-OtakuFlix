<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OtakuFlix</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08080d;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111118;
      padding: 18px 22px;
      border-bottom: 1px solid #292934;
    }

    .logo {
      color: #e50914;
      font-size: 27px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin: 20px;
      padding: 11px 18px;
      background: #24242e;
      color: white;
      text-decoration: none;
      border-radius: 9px;
    }

    .details {
      max-width: 1100px;
      margin: 10px auto 40px;
      padding: 25px;
      display: flex;
      gap: 30px;
      background: #111118;
      border-radius: 18px;
    }

    .poster {
      width: 280px;
      height: 400px;
      object-fit: cover;
      border-radius: 12px;
    }

    .content {
      flex: 1;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 18px;
    }

    .description {
      color: #bbb;
      line-height: 1.9;
      margin-top: 20px;
    }

    .info {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      background: #24242e;
      padding: 9px 13px;
      border-radius: 8px;
    }

    .rating {
      color: #ffd43b;
    }

    .episodes-section {
      max-width: 1100px;
      margin: auto;
      padding: 20px 25px 60px;
    }

    .episodes-section h2 {
      margin-bottom: 20px;
    }

    .episodes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }

    .episode {
      background: #181820;
      border: 1px solid #292934;
      color: white;
      padding: 14px 8px;
      border-radius: 9px;
      cursor: pointer;
      text-align: center;
    }

    .episode:hover {
      background: #e50914;
    }

    .message {
      color: #aaa;
      padding: 30px 0;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 30px;
      border-top: 1px solid #20202a;
    }

    @media (max-width: 700px) {

      .details {
        margin: 10px 15px 30px;
        padding: 18px;
        flex-direction: column;
      }

      .poster {
        width: 100%;
        max-width: 280px;
        height: 390px;
        margin: auto;
      }

      h1 {
        font-size: 27px;
      }

      .episodes-section {
        padding: 15px;
      }
    }
  </style>
</head>


<body>

  <header>
    <div class="logo">🎬 OtakuFlix</div>
  </header>


  <a href="index.html" class="back">
    ← العودة للرئيسية
  </a>


  <main id="details" class="message">
    جاري تحميل المعلومات...
  </main>


  <section class="episodes-section">

    <h2>📺 الحلقات</h2>

    <div id="episodes" class="episodes">
      <div class="message">
        جاري تحميل الحلقات...
      </div>
    </div>

  </section>


  <footer>
    © 2026 OtakuFlix
  </footer>


<script>

const details = document.getElementById("details");
const episodes = document.getElementById("episodes");

const params = new URLSearchParams(window.location.search);
const animeId = params.get("id");


async function getData(url, attempts = 3) {

  for (let i = 0; i < attempts; i++) {

    try {

      const response = await fetch(url);

      if (response.ok) {
        return await response.json();
      }

    } catch (error) {
      console.log(error);
    }

    await new Promise(resolve =>
      setTimeout(resolve, 1500)
    );
  }

  throw new Error("فشل الاتصال");
}


async function loadDetails() {

  if (!animeId) {

    details.innerHTML =
      "❌ لم يتم تحديد الأنمي.";

    return;
  }


  try {

    const result = await getData(
      `https://api.jikan.moe/v4/anime/${animeId}/full`
    );

    const anime = result.data;


    const title =
      anime.title ||
      anime.title_english ||
      "Anime";


    const poster =
      anime.images?.jpg?.large_image_url ||
      anime.images?.jpg?.image_url ||
      "";


    const score =
      anime.score
        ? anime.score.toFixed(1)
        : "N/A";


    const year =
      anime.year ||
      "غير معروف";


    const count =
      anime.episodes ||
      "غير معروف";


    details.className = "details";


    details.innerHTML = `

      <img
        class="poster"
        src="${poster}"
        alt="${title}"
      >

      <div class="content">

        <h1>${title}</h1>

        <div class="info">

          <span class="tag rating">
            ⭐ ${score}
          </span>

          <span class="tag">
            📅 ${year}
          </span>

          <span class="tag">
            🎞️ ${count} حلقة
          </span>

          <span class="tag">
            ${anime.status || "غير معروف"}
          </span>

        </div>

        <p class="description">
          ${anime.synopsis || "لا توجد قصة متاحة حالياً."}
        </p>

      </div>

    `;


    document.title =
      `${title} - OtakuFlix`;


    loadEpisodes();


  } catch (error) {

    details.innerHTML = `
      <div class="message">
        ❌ تعذر تحميل معلومات هذا الأنمي.<br><br>
        اضغط تحديث الصفحة وحاول مرة ثانية.
      </div>
    `;

  }

}


async function loadEpisodes() {

  episodes.innerHTML = `
    <div class="message">
      جاري تحميل الحلقات...
    </div>
  `;


  try {

    const result = await getData(
      `https://api.jikan.moe/v4/anime/${animeId}/episodes?limit=100`
    );


    episodes.innerHTML = "";


    if (
      !result.data ||
      result.data.length === 0
    ) {

      episodes.innerHTML = `
        <div class="message">
          لا توجد معلومات عن الحلقات لهذا الأنمي.
        </div>
      `;

      return;
    }


    result.data.forEach(ep => {

      const button =
        document.createElement("div");


      button.className = "episode";


      button.textContent =
        `الحلقة ${ep.mal_id}`;


      button.onclick = () => {

        alert(
          `الحلقة ${ep.mal_id}\n\nالمشاهدة سنضيفها بالخطوة القادمة 🎬`
        );

      };


      episodes.appendChild(button);

    });


  } catch (error) {

    episodes.innerHTML = `
      <div class="message">
        ⚠️ تعذر تحميل الحلقات حالياً.<br>
        حاول تحديث الصفحة بعد قليل.
      </div>
    `;

  }

}


loadDetails();

</script>

</body>
</html>
