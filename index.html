<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OtakuFlix | أفلام وأنمي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08080d;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111118;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #252530;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #e50914;
      white-space: nowrap;
    }

    .search-box {
      width: 100%;
      max-width: 500px;
    }

    #search {
      width: 100%;
      background: #24242e;
      color: white;
      border: 1px solid #353542;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      outline: none;
    }

    #search:focus {
      border-color: #e50914;
    }

    .hero {
      text-align: center;
      padding: 75px 20px;
      background:
        radial-gradient(circle at center, #242438 0%, #08080d 65%);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 18px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
    }

    .section {
      padding: 35px 25px 60px;
      max-width: 1400px;
      margin: auto;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 22px;
    }

    .card {
      background: #15151d;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.25s;
      border: 1px solid #24242e;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: #e50914;
    }

    .poster {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #20202a;
    }

    .info {
      padding: 13px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      color: #999;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 5px;
    }

    .rating {
      color: #ffd43b;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #aaa;
      font-size: 18px;
    }

    .error {
      text-align: center;
      padding: 40px;
      color: #ff7777;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
      border-top: 1px solid #20202a;
    }

    @media (max-width: 600px) {

      header {
        flex-direction: column;
        padding: 15px;
      }

      .logo {
        font-size: 25px;
      }

      .hero {
        padding: 55px 15px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .hero p {
        font-size: 16px;
      }

      .section {
        padding: 25px 15px 40px;
      }

      .movies {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .poster {
        height: 230px;
      }
    }
  </style>
</head>


<body>

  <header>

    <div class="logo">
      🎬 OtakuFlix
    </div>

    <div class="search-box">

      <input
        id="search"
        type="text"
        placeholder="ابحث عن أنمي..."
        autocomplete="off"
      >

    </div>

  </header>


  <section class="hero">

    <h1>🍿 مرحباً بك في OtakuFlix</h1>

    <p>
      اكتشف أفضل الأنميات في مكان واحد
    </p>

  </section>


  <section class="section">

    <h2 class="section-title">
      🔥 أحدث الأنميات
    </h2>

    <div id="movies" class="movies">

      <div class="loading">
        جاري تحميل الأنميات...
      </div>

    </div>

  </section>


  <footer>
    © 2026 OtakuFlix
  </footer>


  <script>

    const moviesContainer =
      document.getElementById("movies");

    const searchInput =
      document.getElementById("search");

    let animeList = [];


    async function loadAnime() {

      try {

        const response = await fetch(
          "https://api.jikan.moe/v4/top/anime?limit=24"
        );

        if (!response.ok) {
          throw new Error("API Error");
        }

        const result = await response.json();

        animeList = result.data;

        displayAnime(animeList);

      } catch (error) {

        moviesContainer.innerHTML = `
          <div class="error">
            ❌ تعذر تحميل الأنميات.<br>
            حاول تحديث الصفحة.
          </div>
        `;

      }

    }


    function displayAnime(list) {

      moviesContainer.innerHTML = "";

      if (!list || list.length === 0) {

        moviesContainer.innerHTML = `
          <div class="error">
            لا توجد نتائج 😔
          </div>
        `;

        return;
      }


      list.forEach(anime => {

        const title =
          anime.title_english ||
          anime.title ||
          "Anime";

        const poster =
          anime.images?.jpg?.large_image_url ||
          anime.images?.jpg?.image_url ||
          "";

        const score =
          anime.score
            ? anime.score.toFixed(1)
            : "N/A";

        const year =
          anime.year ||
          "غير معروف";

        const episodes =
          anime.episodes ||
          "?";


        const card =
          document.createElement("div");

        card.className = "card";


        card.innerHTML = `

          <img
            class="poster"
            src="${poster}"
            alt="${title}"
            loading="lazy"
          >

          <div class="info">

            <div class="title">
              ${title}
            </div>

            <div class="meta">

              <span>
                ${year}
              </span>

              <span>
                ${episodes} حلقة
              </span>

              <span class="rating">
                ⭐ ${score}
              </span>

            </div>

          </div>

        `;


        card.addEventListener("click", () => {

          window.location.href =
            `anime.html?id=${anime.mal_id}`;

        });


        moviesContainer.appendChild(card);

      });

    }


    searchInput.addEventListener(
      "input",
      function () {

        const searchText =
          this.value
            .toLowerCase()
            .trim();


        if (!searchText) {

          displayAnime(animeList);

          return;

        }


        const filtered =
          animeList.filter(anime => {

            const title =
              (
                anime.title ||
                ""
              ).toLowerCase();


            const englishTitle =
              (
                anime.title_english ||
                ""
              ).toLowerCase();


            const japaneseTitle =
              (
                anime.title_japanese ||
                ""
              ).toLowerCase();


            return (
              title.includes(searchText) ||
              englishTitle.includes(searchText) ||
              japaneseTitle.includes(searchText)
            );

          });


        displayAnime(filtered);

      }
    );


    loadAnime();

  </script>

</body>

</html>
