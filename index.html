<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OtakuFlix</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      background: #15151c;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #e50914;
    }

    .search {
      background: #24242d;
      border: none;
      outline: none;
      color: white;
      padding: 12px 15px;
      border-radius: 8px;
      width: 250px;
    }

    .hero {
      padding: 70px 25px;
      text-align: center;
      background: linear-gradient(135deg, #181824, #0b0b0f);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
    }

    .section {
      padding: 30px 20px;
    }

    .section h2 {
      margin-bottom: 20px;
      font-size: 25px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }

    .card {
      background: #17171f;
      border-radius: 10px;
      overflow: hidden;
      transition: 0.3s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .poster {
      width: 100%;
      height: 230px;
      background: linear-gradient(135deg, #292938, #15151c);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 45px;
    }

    .info {
      padding: 12px;
    }

    .info h3 {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .info p {
      color: #999;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      .hero h1 {
        font-size: 32px;
      }

      .movies {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">OtakuFlix 🎬</div>

    <input
      class="search"
      type="text"
      placeholder="ابحث عن فيلم أو أنمي..."
      id="search"
    >
  </header>

  <section class="hero">
    <h1>مرحباً بك في OtakuFlix 🍿</h1>
    <p>اكتشف أفضل الأفلام والأنمي في مكان واحد</p>
  </section>

  <section class="section">
    <h2>🔥 أحدث الإضافات</h2>

    <div class="movies" id="movies">

      <div class="card">
        <div class="poster">🎬</div>
        <div class="info">
          <h3>فيلم تجريبي</h3>
          <p>2026 • فيلم</p>
        </div>
      </div>

      <div class="card">
        <div class="poster">🍥</div>
        <div class="info">
          <h3>Anime Demo</h3>
          <p>2026 • أنمي</p>
        </div>
      </div>

      <div class="card">
        <div class="poster">⭐</div>
        <div class="info">
          <h3>Movie Demo</h3>
          <p>2026 • فيلم</p>
        </div>
      </div>

      <div class="card">
        <div class="poster">⚔️</div>
        <div class="info">
          <h3>Anime Demo 2</h3>
          <p>2026 • أنمي</p>
        </div>
      </div>

    </div>
  </section>

  <footer>
    © 2026 OtakuFlix
  </footer>

  <script>
    const search = document.getElementById("search");
    const cards = document.querySelectorAll(".card");

    search.addEventListener("input", function () {
      const text = this.value.toLowerCase();

      cards.forEach(card => {
        const title = card.innerText.toLowerCase();

        card.style.display =
          title.includes(text) ? "block" : "none";
      });
    });
  </script>

</body>
</html>
