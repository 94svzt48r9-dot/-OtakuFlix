<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OtakuFlix | أنمي وأفلام</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08080d;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111118;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #292934;
    }

    .logo {
      color: #e50914;
      font-size: 28px;
      font-weight: bold;
      white-space: nowrap;
    }

    .search {
      width: 100%;
      max-width: 500px;
    }

    #search {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #353542;
      background: #24242e;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #search:focus {
      border-color: #e50914;
    }

    .hero {
      text-align: center;
      padding: 65px 20px;
      background: radial-gradient(
        circle at center,
        #242438 0%,
        #08080d 70%
      );
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 18px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
    }

    .section {
      max-width: 1400px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
    }

    .card {
      background: #15151d;
      border: 1px solid #292934;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #e50914;
    }

    .poster {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #22222b;
    }

    .info {
      padding: 13px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      color: #999;
      font-size: 13px;
    }

    .rating {
      color: #ffd43b;
    }

    .message {
      text-align: center;
      padding: 40px;
      color: #aaa;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
      border-top: 1px solid #20202a;
    }

    @media (max-width: 600px) {

      header {
        flex-direction: column;
      }

      .logo {
        font-size: 25px;
      }

      .hero {
        padding: 50px 15px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .hero p {
        font-size: 16px;
      }

      .section {
        padding: 25px 15px 45px;
      }

      .movies {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .poster {
        height: 230px;
      }
    }
  </style>
</head>


<body>

  <header>

    <div class="logo">
      🎬 OtakuFlix
    </div>

    <div class="search">

      <input
        id="search"
        type="text"
        placeholder="ابحث عن أنمي..."
        autocomplete="off"
      >

    </div>

  </header>


  <section class="hero">

    <h1>🍿 مرحباً بك في OtakuFlix</h1>

    <p>
      اكتشف أفضل الأنميات في مكان واحد
    </p>

  </section>


  <section class="section">

    <h2 class="section-title">
      🔥 أحدث الأنميات
    </h2>

    <div id="movies" class="movies"></div>

  </section>


  <footer>
    © 2026 OtakuFlix
  </footer>


<script>

const moviesContainer =
  document.getElementById("movies");

const searchInput =
  document.getElementById("search");


/*
  بيانات احتياطية
  حتى الموقع ما يصير فارغ إذا الـAPI توقف
*/

const fallbackAnime = [

  {
    mal_id: 5114,
    title: "Fullmetal Alchemist: Brotherhood",
    year: 2009,
    episodes: 64,
    score: 9.1,
    image:
      "https://cdn.myanimelist.net/images/anime/1208/94745l.jpg"
  },

  {
    mal_id: 16498,
    title: "Attack on Titan",
    year: 2013,
    episodes: 25,
    score: 9.1,
    image:
      "https://cdn.myanimelist.net/images/anime/10/47347l.jpg"
  },

  {
    mal_id: 1535,
    title: "Death Note",
    year: 2006,
    episodes: 37,
    score: 8.6,
    image:
      "https://cdn.myanimelist.net/images/anime/9/9453l.jpg"
  },

  {
    mal_id: 30276,
    title: "One Punch Man",
    year: 2015,
    episodes: 12,
    score: 8.5,
    image:
      "https://cdn.myanimelist.net/images/anime/12/76049l.jpg"
  },

  {
    mal_id: 11757,
    title: "Sword Art Online",
    year: 2012,
    episodes: 25,
    score: 7.2,
    image:
      "https://cdn.myanimelist.net/images/anime/11/39717l.jpg"
  },

  {
    mal_id: 21,
    title: "One Piece",
    year: 1999,
    episodes: 1000,
    score: 8.7,
    image:
      "https://cdn.myanimelist.net/images/anime/6/73245l.jpg"
  },

  {
    mal_id: 20,
    title: "Naruto",
    year: 2002,
    episodes: 220,
    score: 8.0,
    image:
      "https://cdn.myanimelist.net/images/anime/13/17405l.jpg"
  },

  {
    mal_id: 269,
    title: "Bleach",
    year: 2004,
    episodes: 366,
    score: 8.2,
    image:
      "https://cdn.myanimelist.net/images/anime/3/40451l.jpg"
  }

];


let animeList = [];


/*
  عرض الأنميات
*/

function displayAnime(list) {

  moviesContainer.innerHTML = "";

  if (!list || list.length === 0) {

    moviesContainer.innerHTML = `
      <div class="message">
        😔 لا توجد نتائج
      </div>
    `;

    return;
  }


  list.forEach(anime => {

    const card =
      document.createElement("div");

    card.className = "card";


    const title =
      anime.title ||
      anime.title_english ||
      "Anime";


    const image =
      anime.image ||
      anime.images?.jpg?.large_image_url ||
      anime.images?.jpg?.image_url ||
      "";


    const year =
      anime.year ||
      anime.aired?.prop?.from?.year ||
      "غير معروف";


    const episodes =
      anime.episodes ||
      "?";


    const score =
      anime.score
        ? Number(anime.score).toFixed(1)
        : "N/A";


    card.innerHTML = `

      <img
        class="poster"
        src="${image}"
        alt="${title}"
        loading="lazy"
      >

      <div class="info">

        <div class="title">
          ${title}
        </div>

        <div class="meta">

          <span>
            ${year}
          </span>

          <span>
            ${episodes} حلقة
          </span>

          <span class="rating">
            ⭐ ${score}
          </span>

        </div>

      </div>

    `;


    /*
      فتح صفحة التفاصيل
    */

    card.addEventListener("click", () => {

      window.location.href =
        "anime.html?id=" + anime.mal_id;

    });


    moviesContainer.appendChild(card);

  });

}


/*
  محاولة تحميل أنميات حقيقية
*/

async function loadAnime() {

  /*
    أولاً نعرض البيانات الاحتياطية
    حتى تظهر الصفحة مباشرة
  */

  animeList = fallbackAnime;

  displayAnime(animeList);


  /*
    بعدها نحاول جلب بيانات حقيقية
  */

  try {

    const response = await fetch(
      "https://api.jikan.moe/v4/top/anime?limit=24"
    );


    if (!response.ok) {
      throw new Error("API error");
    }


    const result =
      await response.json();


    if (
      result.data &&
      result.data.length > 0
    ) {

      animeList = result.data;

      displayAnime(animeList);

    }

  } catch (error) {

    console.log(
      "Using fallback anime list"
    );

  }

}


/*
  البحث
*/

searchInput.addEventListener(
  "input",
  function () {

    const text =
      this.value
        .toLowerCase()
        .trim();


    if (!text) {

      displayAnime(animeList);

      return;

    }


    const filtered =
      animeList.filter(anime => {

        const title =
          (
            anime.title ||
            ""
          ).toLowerCase();


        const english =
          (
            anime.title_english ||
            ""
          ).toLowerCase();


        return (
          title.includes(text) ||
          english.includes(text)
        );

      });


    displayAnime(filtered);

  }
);


/*
  تشغيل الموقع
*/

loadAnime();

</script>

</body>

</html>
